# ─────────────────────────────────────────────────────
#  3. 自定义代码策略 — RSI 超买超卖
# ─────────────────────────────────────────────────────
#  原理：RSI < 30 做多（超卖反弹），RSI > 70 做空（超买回落）
#  适合：震荡市，短线
#
#  code 字段必须定义 calculate_factor(df) 函数
#  df 包含列: open, high, low, close, volume
#  返回 pd.Series，系统自动 z-score 标准化

inline_rsi_btc:
  id: rsi_btc
  type: inline_code
  weight: 1.0
  symbol: BTC
  interval: 15m
  z_threshold: 1.0
  direction: -1  # RSI 高→做空，所以取反
  account_id: ""
  code: |
    import pandas as pd
    def calculate_factor(df):
        delta = df["close"].diff()
        gain = delta.clip(lower=0).rolling(14).mean()
        loss = (-delta.clip(upper=0)).rolling(14).mean()
        rs = gain / loss.replace(0, 1e-10)
        rsi = 100 - (100 / (1 + rs))
        return rsi


# ─────────────────────────────────────────────────────
#  4. 自定义代码策略 — 布林带突破
# ─────────────────────────────────────────────────────
#  原理：价格突破布林带上轨做多，突破下轨做空
#  适合：趋势行情，波动放大时

inline_boll_btc:
  id: boll_btc
  type: inline_code
  weight: 1.0
  symbol: BTC
  interval: 1h
  z_threshold: 1.0
  direction: 1
  account_id: ""
  code: |
    import pandas as pd
    def calculate_factor(df):
        ma = df["close"].rolling(20).mean()
        std = df["close"].rolling(20).std()
        upper = ma + 2 * std
        lower = ma - 2 * std
        # 价格相对布林带位置，>0 偏上轨，<0 偏下轨
        return (df["close"] - ma) / std.replace(0, 1e-10)


# ─────────────────────────────────────────────────────
#  5. 自定义代码策略 — 双均线交叉
# ─────────────────────────────────────────────────────
#  原理：快线（EMA12）上穿慢线（EMA26）做多，下穿做空
#  适合：趋势跟踪，中频

inline_ema_cross_btc:
  id: ema_cross_btc
  type: inline_code
  weight: 1.0
  symbol: BTC
  interval: 1h
  z_threshold: 0.5
  direction: 1
  account_id: ""
  code: |
    import pandas as pd
    def calculate_factor(df):
        ema_fast = df["close"].ewm(span=12).mean()
        ema_slow = df["close"].ewm(span=26).mean()
        return ema_fast - ema_slow


# ─────────────────────────────────────────────────────
#  6. 自定义代码策略 — 成交量价格背离
# ─────────────────────────────────────────────────────
#  原理：价格创新高但成交量萎缩 → 顶部信号（做空）
#       价格创新低但成交量萎缩 → 底部信号（做多）
#  适合：反转捕捉

inline_vol_div_btc:
  id: vol_div_btc
  type: inline_code
  weight: 0.8
  symbol: BTC
  interval: 4h
  z_threshold: 1.0
  direction: -1
  account_id: ""
  code: |
    import pandas as pd
    import numpy as np
    def calculate_factor(df):
        price_pct = df["close"].pct_change(5)
        vol_pct = df["volume"].pct_change(5)
        # 价格涨但量缩 → 正值（反转信号）
        divergence = price_pct - vol_pct
        return divergence.rolling(3).mean()


# ─────────────────────────────────────────────────────
#  7. Webhook 外部信号
# ─────────────────────────────────────────────────────
#  原理：接收外部系统通过 HTTP POST 推送的信号
#  适合：对接 TradingView Alert、自建策略服务器等
#
#  推送格式：POST /api/webhook
#  {
#    "symbol": "BTC",
#    "direction": "LONG",   // LONG / SHORT / NEUTRAL
#    "strength": 0.8,
#    "source": "tradingview",
#    "secret": "你的密钥"
#  }

webhook_tradingview:
  id: tv_webhook
  type: webhook
  weight: 1.0
  account_id: ""


