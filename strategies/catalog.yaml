# ═══════════════════════════════════════════════════════
#  策 略 库  —  Strategy Catalog
# ═══════════════════════════════════════════════════════
#
#  使用方法：
#    1. 从下方选择策略，复制对应的 YAML 配置
#    2. 粘贴到 config/signals.yaml 的 sources 列表中
#    3. 修改 account_id / symbol / interval 等参数
#    4. 重启服务或点击"运行"即可生效
#
#  也可以通过 Web 界面 → 配置 → 信号源 → 新建 来添加
#
# ─── 信号源类型一览 ────────────────────────────────────
#
#  type: pa_macd       技术分析策略（MACD + K线形态 + 趋势过滤）
#  type: alpha_factor  量化因子策略（z-score 均值回归）
#  type: inline_code   自定义代码策略（在配置中直接写 Python）
#  type: webhook       外部信号接收（通过 HTTP POST 推送）
#
# ═══════════════════════════════════════════════════════


# ─────────────────────────────────────────────────────
#  1. PA + MACD 组合策略
# ─────────────────────────────────────────────────────
#  原理：MACD 金叉/死叉 + 底背离/顶背离 + K线形态（吞没/锤子）
#       + EMA200 趋势过滤 + 成交量确认，多因子加权评分
#  输出：方向 + 强度 + 自动计算止损/止盈（基于 ATR + Swing 点位）
#  适合：趋势跟踪，中低频（15m ~ 4h）
#
#  参数说明：
#    symbol:   交易币种
#    interval: K线周期（1m/5m/15m/1h/4h/1d）
#    limit:    K线数量（>=200，用于计算 EMA200）

pa_macd_btc_15m:
  id: pa_btc_15m
  type: pa_macd
  weight: 1.0
  symbol: BTC
  interval: 15m
  limit: 250
  account_id: ""  # 填入你的账号 ID

